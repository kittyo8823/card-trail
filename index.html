const GVER='1.49';let RNG=null;const cv=document.getElementById('c'),ctx=cv.getContext('2d'),R=()=>RNG?RNG():Math.random(),RI=n=>R()*n|0,pk=a=>a[RI(a.length)];

function tone(f1,f2,d,ty,v,dl){if(!AC||muted)return;const t0=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)}

[12,0,76,6],[12,6,78,2],[12,8,79,4],[12,12,76,4],[13,0,83,8],[13,8,81,4],[13,12,79,4],[14,0,78,4],[14,4,79,4],[14,8,75,8],[15,0,76,12]]};
let GIN=null,NB=null;
function gin(){if(GIN&&GIN.context===AC)return GIN;const sh=AC.createWaveShaper(),n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=61*x/(1+60*Math.abs(x))}sh.curve=c;sh.oversample='2x';
const hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter(),o=AC.createGain();hp.type='highpass';hp.frequency.value=90;lp.type='lowpass';lp.frequency.value=3200;o.gain.value=.09;GIN=AC.createGain();GIN.connect(sh);sh.connect(hp);hp.connect(lp);lp.connect(o);o.connect(BG);return GIN}
function gnote(m,t,d,v,cut,ty,dt){const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type=ty||'sawtooth';o.frequency.value=440*Math.pow(2,(m-69)/12);if(dt)o.detune.value=dt;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+d*.8);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(f);f.connect(g);g.connect(gin());o.start(t);o.stop(t+d+.02);return o}

function lead(m,t,d){for(const dt of[-9,9]){const o=gnote(m,t,d,.06,4200,'square',dt),l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(18,t+Math.min(d,.5));l.connect(lg);lg.connect(o.detune);l.start(t);l.stop(t+d+.02)}}
function mnoise(d,v,fc,t){if(!NB||NB.ctx!==AC){const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;NB={b,ctx:AC}}
const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB.b;f.type='bandpass';f.frequency.value=fc;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(BG);s.start(t);s.stop(t+d)}
function mkick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.09);g.gain.setValueAtTime(.55*(v||1),t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(BG);o.start(t);o.stop(t+.17);mnoise(.012,.25,3500,t)}
function snare(t,v){mnoise(.18,.32*v,1700,t);mnoise(.08,.18*v,5000,t);dnote(54,t,.09,'triangle',.16*v,2000)}
function metalStep(i,t){const ms=i>>4,s=i&15,sec=MT.S[ms],r=MT.R[ms],ch=MT.P[sec][s],rt=sec==='A'&&ms%2===1&&s>=12?r+1:r,lg=sec==='C'?5.5:2.6;
if(s===0){const th=r===35?4:3,fi=r===39?6:7;for(const n of[r+24,r+24+th,r+24+fi]){dnote(n,t,bsp*16.2,'sawtooth',.016,700,-8);dnote(n,t,bsp*16.2,'sawtooth',.016,700,8)}if(ms%4===0)mnoise(1.3,.14,6000,t);if(sec==='C')bell(r+24,t)}
if(ch==='X'){pchord(rt,t,bsp*lg,.1,2400);dnote(rt-12,t,bsp*lg,'sawtooth',.1,260)}else if(ch==='x'){pchord(rt,t,bsp*.75,.08,750);dnote(rt-12,t,bsp*.75,'sawtooth',.09,260)}

else{if(ch!=='.'&&!(sec==='D'&&s>=8))mkick(t);if(sec==='D'&&s>=8)snare(t,.35+(s-8)*.09);else if(s===4||s===12)snare(t,1);if(!(s&1))mnoise(.04,.06,8500,t)}

// ===== タイトル・キャラ選択の曲（BPM76、1ステップ＝8分音符、32小節で1周）=====
// ピアノ・柔らかい弦・フルート・ベル＋残響。周ごとに主旋律の楽器が入れ替わる
const AMC={Dm9:[50,57,62,64,65,69],Bb7:[46,53,57,62,65,69],Gm9:[43,50,57,58,62,65],Asus:[45,52,57,62,64,69],A:[45,52,57,61,64,69],F7:[41,48,53,57,60,64],C9:[48,55,60,62,64,67],Eb7:[51,58,62,65,67,70],Am7:[45,52,57,60,64,67]};

const AMSEC=b=>b<4?'i':b<12?'a':b<20?'v':b<28?'b':'o';
// 旋律 [小節, 拍(8分), 音, 長さ]
const AML={a:[[4,0,69,4],[4,4,74,2],[4,6,72,2],[5,0,70,6],[5,6,69,2],[6,0,65,4],[6,4,67,2],[6,6,69,2],[7,0,67,8],[8,0,62,2],[8,2,65,2],[8,4,70,4],[9,0,69,4],[9,4,67,2],[9,6,65,2],[10,0,64,4],[10,4,62,2],[10,6,64,2],[11,0,61,8]],
v:[[12,0,74,3],[12,3,76,1],[12,4,77,2],[12,6,76,2],[13,0,74,6],[13,6,72,2],[14,0,69,4],[14,4,72,2],[14,6,74,2],[15,0,76,8],[16,0,74,2],[16,2,77,2],[16,4,79,4],[17,0,79,4],[17,4,77,2],[17,6,74,2],[18,0,76,4],[18,4,74,2],[18,6,73,2],[19,0,73,8]],
b:[[20,0,74,8],[21,0,76,8],[22,0,72,4],[22,4,76,4],[23,0,77,6],[23,6,76,2],[24,0,74,8],[25,0,72,4],[25,4,74,2],[25,6,76,2],[26,0,77,8],[27,0,76,4],[27,4,74,4]],
e:[[21,4,81,2],[21,6,79,2],[23,4,81,4],[25,4,79,2],[25,6,77,2],[27,4,81,4]],o:[[28,0,69,4],[29,0,70,4],[30,0,65,6],[31,4,64,4]]};
let AMB=null;
function amBus(){if(AMB&&AMB.ctx===AC&&AMB.bg===BG)return AMB.in;const i=AC.createGain(),dry=AC.createGain(),cv=AC.createConvolver(),wet=AC.createGain(),L=AC.sampleRate*3.2,ir=AC.createBuffer(2,L,AC.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let k=0;k<L;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/L,2.6)}cv.buffer=ir;dry.gain.value=1.2;wet.gain.value=1.55;i.connect(dry);dry.connect(BG);i.connect(cv);cv.connect(wet);wet.connect(BG);AMB={ctx:AC,bg:BG,in:i};return i}

 [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12]].forEach(([r,ty,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=ty;o.frequency.value=mf(m)*r;og.gain.value=a;o.connect(og);og.connect(f);o.start(t);o.stop(t+2.7)})}
function aStr(ns,t,d,v){const out=amBus(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=1100;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.35);g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(.0001,t+d+.6);f.connect(g);g.connect(out);

function aFlute(m,t,d,v){const out=amBus(),o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.value=o2.frequency.value=mf(m);
 const g2=AC.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(g);o.connect(g);l.frequency.value=5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(9,t+Math.min(.6,d*.6));l.connect(lg);lg.connect(o.detune);lg.connect(o2.detune);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.09);g.gain.setValueAtTime(v*.9,t+Math.max(.1,d-.15));g.gain.linearRampToValueAtTime(.0001,t+d+.25);g.connect(out);for(const x of[o,o2,l]){x.start(t);x.stop(t+d+.3)}

function ambStep(n,t){const i=n%256,lp=Math.floor(n/256),b=i>>3,s=i&7,sec=AMSEC(b),ch=AMC[AMS[b]],sw=lp%2;

/* ===== 入力 ===== */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*360/r.height}}
function discardCard(i){if(MPB&&!MPB.ap){const h=B.hand[i];if(h)mpIn(['d',i,h.i]);return}const o=B.hand.splice(i,1)[0];if(!o)return;B.dis.push(o);cFly(o,'dis',o.hx,o.hy);if(PS.dsd)for(const e of alive())hitE(e,PS.dsd,.1,0,0);const c=cd(o);sfx('cl');
if(c.od==='dr'){drawC(c.ov);fxs('ar',110,150,{s:'＋',c:'#7ec8ff',d:.6})}if(c.od==='en'){B.me+=c.ov;sfx('bf');nmb(34,225,'エナジー+'+c.ov,'#7ec8ff')}
B.dsc--;if(!B.hand.length||B.dsc<0)B.dsc=0}
function tapCard(i){const b=B,o=b.hand[i],c=cd(o);sfx('cl');if(b.dsc>0){discardCard(i);return}if(b.sel!==i){b.sel=i;return}if(c.un){say(c.od?'使用不可。捨てたときに効果が発動する':'このカードは使えない');return}
if(!(c.X||b.me>=c.c)){sfx('no');say('エナジーが足りない');return}
if(needT(c)&&alive().length>1){say('カードを敵へドラッグして使用');return}play(i,0)}
function dropCard(){const d=dg;dg=null;if(!B||B.ph!=='p'||B.vt)return;const o=B.hand[d.i];if(!o)return;
if(!d.mv){tapCard(d.i);return}if(B.dsc>0)return;
const c=cd(o);if(d.y>=236){B.sel=-1;return}
if(needT(c)){let ti=-1;for(const r of ER)if(d.x>=r.x-14&&d.x<=r.x+r.w+14&&d.y>=r.y-14&&d.y<=r.y+r.h+14){ti=r.i;break}
if(ti<0&&alive().length===1)ti=B.en.indexOf(alive()[0]);
if(ti<0){say('敵の上で離して使用');B.sel=-1;return}play(d.i,ti)}else play(d.i,0)}
cv.addEventListener('pointerdown',e=>{initAudio();const p=pos(e);drag={...p,sc:scr,ms:MSC,m:0};dg=null;
if(S==='battle'&&B&&B.ph==='p'&&!B.vt&&!PM)for(let k=CR.length-1;k>=0;k--){const r=CR[k];if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+106){dg={i:r.i,x:p.x,y:p.y,sx:p.x,sy:p.y,mv:0};break}}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);
if(dg){dg.x=p.x;dg.y=p.y;if(!dg.mv&&Math.hypot(p.x-dg.sx,p.y-dg.sy)>10){dg.mv=1;B.sel=dg.i;sfx('cl')}return}
if(Math.abs(p.y-drag.y)>8)drag.m=1;if((S==='pick'||S==='help'||S==='lib')&&drag.m)scr=drag.sc-(p.y-drag.y);
if(S==='select'&&Math.abs(p.x-drag.x)>8)drag.m=1;if(S==='map'){if(Math.abs(p.x-drag.x)>8)drag.m=1;if(drag.m)MSC=Math.max(0,Math.min(MSW-624,drag.ms-(p.x-drag.x)))}});
addEventListener('keydown',e=>{if(S==='splash'){startGame();return}if(S==='select'){if(e.key==='ArrowLeft')selGo(-1);if(e.key==='ArrowRight')selGo(1);if(e.key==='Enter'){sfx('pk');newRun(SEL)}}});
cv.addEventListener('wheel',e=>{if(S==='map'){MSC=Math.max(0,Math.min(MSW-624,MSC+(e.deltaX||e.deltaY)*.6));e.preventDefault()}else if(S==='lib'||S==='pick'||S==='help'){scr+=e.deltaY*.6;e.preventDefault()}},{passive:false});
addEventListener('pointerup',e=>{if(dg){drag=null;dropCard();return}if(!drag)return;const d=drag;drag=null;if(d.m){if(S==='select'){const dx=pos(e).x-d.x;if(Math.abs(dx)>40)selGo(dx<0?1:-1)}return}for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(d.x>=b.x&&d.x<=b.x+b.w&&d.y>=b.y&&d.y<=b.y+b.h){b.f();break}}});
addEventListener('pointercancel',()=>{drag=null;dg=null});
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;if(BG)BG.gain.value=muted?0:.2;mpTick();mpCatch();update(dt);nmPlace();ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=false;draw();requestAnimationFrame(loop)}
function startGame(){if(S!=='splash')return;initAudio();S='title';bgm('t');sfx('pk')}
try{AC=new(window.AudioContext||window.webkitAudioContext)();const ok=()=>{if(AC.state==='running'&&S==='splash'){S='title';bgm('t')}};AC.resume().then(ok).catch(()=>{});setTimeout(ok,300)}catch(e){}
requestAnimationFrame(loop);
